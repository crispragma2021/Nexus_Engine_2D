name: Build & Release Dist

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Build
        run: npm run build

      - name: Package dist
        run: |
          tar -czf dist.tar.gz dist/
          echo "MD5 Checksum:"
          md5sum dist.tar.gz

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest Dist Build"
          files: dist.tar.gz
          draft: false
          prerelease: false
