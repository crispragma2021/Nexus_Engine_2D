name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Copy manifest
        run: |
          mkdir -p dist
          cp public/manifest.webmanifest dist/manifest.json 2>/dev/null || echo "No manifest found"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore
        run: |
          mkdir -p android
          keytool -genkeypair -v \
            -keystore android/android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nexusEngine2026 \
            -keypass nexusEngine2026 \
            -dname "CN=NexusEngine, OU=Dev, O=Nexus, L=Asuncion, C=PY" \
            -deststoretype pkcs12

      - name: Init Bubblewrap (full non-interactive)
        run: |
          cd android
          python3 << 'PYTHON_SCRIPT'
          import subprocess
          import sys
          import os
          
          # Obtener la ruta del JDK del entorno
          java_home = os.environ.get('JAVA_HOME', '/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64')
          
          cmd = [
              'bubblewrap', 'init',
              '--manifest', '../dist/manifest.json',
              '--packageId', 'com.nexusengine.app',
              '--appName', 'Nexus Engine',
              '--appVersion', '1.0.0'
          ]
          
          try:
              # Enviar respuestas: No al JDK, luego la ruta del JDK
              process = subprocess.Popen(
                  cmd,
                  stdin=subprocess.PIPE,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True
              )
              
              # Primera pregunta: ¿Instalar JDK? -> No
              # Segunda pregunta: Ruta del JDK -> JAVA_HOME
              stdout, stderr = process.communicate(input=f'n\n{java_home}\n')
              
              print(stdout)
              if stderr:
                  print(stderr, file=sys.stderr)
              
              sys.exit(process.returncode)
          except Exception as e:
              print(f"Error: {e}", file=sys.stderr)
              sys.exit(1)
          PYTHON_SCRIPT

      - name: Build APK
        run: |
          cd android
          bubblewrap build \
            --keystore android.keystore \
            --keystorePassword nexusEngine2026 \
            --keyAlias android \
            --keyPassword nexusEngine2026

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
