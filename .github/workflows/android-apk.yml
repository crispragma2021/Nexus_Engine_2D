name: Android APK (Trusted Web Activity)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Generate optimized Nexus icons
        run: bun run generate-icons || echo "No icons script found"

      - name: Verify TypeScript
        run: bun run type-check || echo "No type-check script found"

      - name: Verify ESLint
        run: bun run lint || echo "No lint script found"

      - name: Build the web application
        run: bun run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install --global "@bubblewrap/cli@1.25.0"

      - name: Restore or Generate Android signing key
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          KEYSTORE_FILE="$GITHUB_WORKSPACE/android/android.keystore"
          
          if [[ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]]; then
            echo "Restaurando keystore desde secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          fi
          
          if [[ ! -s "$KEYSTORE_FILE" ]]; then
            echo "🔑 Generando keystore de firma automático..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "android" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "nexusEngine2026" \
              -keypass "nexusEngine2026" \
              -dname "CN=NexusEngine, OU=Dev, O=Nexus, L=Asuncion, C=PY" \
              -deststoretype pkcs12
          fi
          
          echo "🔍 Verificando keystore..."
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "nexusEngine2026" || {
            echo "❌ Keystore corrupto, regenerando..."
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "android" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "nexusEngine2026" \
              -keypass "nexusEngine2026" \
              -dname "CN=NexusEngine, OU=Dev, O=Nexus, L=Asuncion, C=PY" \
              -deststoretype pkcs12
          }
          
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=nexusEngine2026" >> $GITHUB_ENV
          echo "BUBBLEWRAP_KEY_PASSWORD=nexusEngine2026" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=android" >> $GITHUB_ENV
          
          ls -lh "$KEYSTORE_FILE"

      - name: Wait for the tagged web deployment
        run: |
          echo "⏳ Esperando deployment en Vercel..."
          for attempt in {1..20}; do
            manifest_url="${PWA_URL%/}/manifest.json"
            if curl --fail --silent --show-error --location --output /dev/null "$manifest_url"; then
              echo "✅ Live manifest found at $manifest_url"
              break
            fi
            echo "⏳ Esperando deployment (intento $attempt/20)..."
            sleep 15
          done

      - name: Configure the TWA for this release
        run: |
          cd android
          bubblewrap init --manifest "${PWA_URL%/}/manifest.json"
          cat bubblewrap.json

      - name: Generate the Android project
        run: |
          cd android
          bubblewrap update

      - name: Build the signed APK and App Bundle
        run: |
          cd android
          chmod +x gradlew
          echo "🔨 Compilando con Gradle..."
          ./gradlew assembleRelease bundleRelease
          
          echo "✅ Build completado"
          find . -name "*.apk" -type f
          find . -name "*.aab" -type f

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusEngine-v0.1.0
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Publish the GitHub release for a tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          prerelease: false
