cat << 'EOF' > .github/workflows/android-apk.yml
name: Android APK (Trusted Web Activity)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Modo de compilacion'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Nexus Engine APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat <<JSON > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          JSON

      - name: Decode Android Keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          mkdir -p android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/android.keystore

      - name: Generate TWA Manifest and Build APK
        run: |
          mkdir -p android
          cd android

          cat <<JSON > twa-manifest.json
          {
            "packageId": "app.autosasistente.twa",
            "host": "autosasistente.app",
            "name": "Nexus Engine 2D",
            "launcherName": "NexusEngine",
            "display": "standalone",
            "themeColor": "#0f172a",
            "themeColorDark": "#0f172a",
            "navigationColor": "#0f172a",
            "navigationColorDark": "#0f172a",
            "navigationDividerColor": "#00000000",
            "navigationDividerColorDark": "#00000000",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://autosasistente.app/icon-512.png",
            "maskableIconUrl": "https://autosasistente.app/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "splashScreenFadeOutDuration": 300,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://autosasistente.app/",
            "shareTarget": {
              "action": "",
              "method": "GET",
              "enctype": "application/x-www-form-urlencoded",
              "params": {
                "title": "",
                "text": "",
                "url": ""
              }
            }
          }
          JSON

          # Generar estructura de proyecto no interactiva
          yes "y" | bubblewrap update --skipPwaValidation || true

          # Compilar APK
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            bubblewrap build --skipPwaValidation
          else
            bubblewrap build --skipPwaValidation --skipSigning
          fi
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-engine-apk
          path: |
            android/**/*.apk
            **/*.apk
          retention-days: 7
EOF
