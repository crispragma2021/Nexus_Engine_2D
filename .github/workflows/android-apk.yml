name: Build APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web with Vite
        run: |
          echo "🔨 Ejecutando npm run build..."
          npm run build
          
          echo "📂 Verificando contenido de dist/ después del build..."
          ls -la dist/ || echo "❌ dist/ no existe después del build"
          
          # Si dist/ está vacío, buscar la salida de Vite en otro lado
          if [ ! -f "dist/index.html" ]; then
            echo "⚠️ dist/index.html no encontrado. Buscando carpeta de build..."
            find . -name "index.html" -type f 2>/dev/null | grep -v node_modules
          fi

      - name: Prepare dist directory
        run: |
          echo "📁 Preparando directorio dist/ para Bubblewrap..."
          
          # Si dist/ no existe o está vacío, copiar desde public/
          if [ ! -f "dist/index.html" ] && [ -d "public" ]; then
            echo "⚠️ dist/ no tiene index.html, copiando public/ a dist/..."
            mkdir -p dist
            cp -r public/* dist/ 2>/dev/null || echo "⚠️ No se pudo copiar"
          fi
          
          # Asegurar que manifest existe en dist/
          if [ -f "public/manifest.webmanifest" ]; then
            cp public/manifest.webmanifest dist/manifest.json
            echo "✅ manifest.webmanifest copiado a dist/manifest.json"
          elif [ -f "public/manifest.json" ]; then
            cp public/manifest.json dist/manifest.json
            echo "✅ manifest.json copiado a dist/manifest.json"
          elif [ ! -f "dist/manifest.json" ]; then
            echo "⚠️ No hay manifest, creando uno básico..."
            cat > dist/manifest.json << 'MANIFEST'
{
  "name": "Nexus Engine",
  "short_name": "NexusEngine",
  "start_url": "/",
  "display": "standalone",
  "background_color": "#ffffff",
  "theme_color": "#000000",
  "icons": [
    {
      "src": "icon-192x192.png",
      "sizes": "192x192",
      "type": "image/png"
    }
  ]
}
MANIFEST
            echo "✅ manifest.json básico creado en dist/"
          fi
          
          echo "📂 Contenido final de dist/:"
          ls -la dist/ || echo "❌ dist/ todavía no existe"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create Android directory
        run: mkdir -p android

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nexusEngine2026 \
            -keypass nexusEngine2026 \
            -dname "CN=NexusEngine, OU=Dev, O=Nexus, L=Asuncion, C=PY" \
            -deststoretype pkcs12

      - name: Init Bubblewrap
        run: |
          cd android
          bubblewrap init \
            --manifest ../dist/manifest.json \
            --packageId com.nexusengine.app \
            --appName "Nexus Engine" \
            --appVersion 1.0.0 \
            --appVersionCode 1 \
            --minSdkVersion 21 \
            --orientation portrait-primary

      - name: Build APK with Bubblewrap
        run: |
          cd android
          bubblewrap build \
            --keystore android.keystore \
            --keystorePassword nexusEngine2026 \
            --keyAlias android \
            --keyPassword nexusEngine2026

      - name: List generated APK
        run: |
          echo "🔍 Buscando APK generada..."
          find . -name "*.apk" -type f 2>/dev/null
          echo "📂 Verificando ubicación común:"
          ls -lh android/app/build/outputs/apk/release/ 2>/dev/null || echo "No APK en la ruta esperada"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/**/*.apk
            **/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/**/*.apk
            **/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
