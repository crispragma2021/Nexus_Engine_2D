name: Android APK (Trusted Web Activity)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Modo de compilacion'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Nexus Engine APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Preconfigure Bubblewrap CLI paths
        run: |
          mkdir -p "$HOME/.bubblewrap"
          
          # Detectar la ruta exacta del SDK que espera Bubblewrap
          SDK_PATH="${ANDROID_HOME}/cmdline-tools/latest"
          if [ ! -d "$SDK_PATH" ]; then
            SDK_PATH="${ANDROID_HOME}"
          fi

          cat <<EOF > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${SDK_PATH}"
          }
          EOF
          echo "Bubblewrap config.json:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Decode Android Keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          mkdir -p android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/android.keystore

      - name: Initialize and Build Android App
        run: |
          PWA_URL="${{ vars.NEXUS_ENGINE_PWA_URL }}"
          if [ -z "$PWA_URL" ]; then
            PWA_URL="https://autosasistente.app"
          fi
          echo "Generando e inicializando APK para: $PWA_URL"

          mkdir -p android
          cd android

          if [ ! -f "twa-manifest.json" ]; then
            yes "" | bubblewrap init --manifest="${PWA_URL}/manifest.webmanifest" --skipPwaValidation --directory . || true
          fi

          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            yes "" | bubblewrap build --skipPwaValidation
          else
            yes "" | bubblewrap build --skipPwaValidation
          fi
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-engine-apk
          path: |
            android/**/*.apk
            **/*.apk
          retention-days: 7
