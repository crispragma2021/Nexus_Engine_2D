name: Build APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Verify manifest.json exists
        run: |
          if [ ! -f dist/manifest.json ]; then
            echo "ERROR: manifest.json not found in dist/"
            exit 1
          fi
          echo "✓ manifest.json found"
          cat dist/manifest.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create Android directory
        run: mkdir -p android

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nexusEngine2026 \
            -keypass nexusEngine2026 \
            -dname "CN=NexusEngine, OU=Dev, O=Nexus, L=Asuncion, C=PY" \
            -deststoretype pkcs12

      - name: Init Bubblewrap
        run: |
          cd android
          bubblewrap init \
            --manifest ../dist/manifest.json \
            --packageId com.nexusengine.app \
            --appName "Nexus Engine" \
            --appVersion 1.0.0 \
            --appVersionCode 1 \
            --minSdkVersion 21 \
            --orientation portrait-primary

      - name: Build APK with Bubblewrap
        run: |
          cd android
          bubblewrap build \
            --keystore android.keystore \
            --keystorePassword nexusEngine2026 \
            --keyAlias android \
            --keyPassword nexusEngine2026

      - name: List generated APK
        run: |
          find android -name "*.apk" -type f
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
