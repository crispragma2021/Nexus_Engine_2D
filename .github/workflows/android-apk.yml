name: Android APK (Trusted Web Activity)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PWA_URL: ${{ vars.NEXUS_ENGINE_PWA_URL || 'https://gdevelop-design-guru.vercel.app' }}
  BUBBLEWRAP_VERSION: "1.25.0"

jobs:
  build:
    name: Build signed Nexus Engine APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Generate optimized Nexus icons
        run: bun run icons

      - name: Verify TypeScript
        run: bun run typecheck

      - name: Verify ESLint
        run: bun run lint

      - name: Build the web application
        run: bun run build

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install --global "@bubblewrap/cli@${BUBBLEWRAP_VERSION}"

      - name: Restore the Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/android.keystore
          chmod 600 android/android.keystore

      - name: Wait for the tagged web deployment
        run: |
          manifest_url="${PWA_URL%/}/manifest.webmanifest"
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location "$manifest_url" -o /tmp/live-manifest.json; then
              echo "Live manifest found at $manifest_url"
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              echo "::error::The live PWA manifest was not reachable at $manifest_url"
              exit 1
            fi
            echo "Waiting for the production deployment (attempt $attempt/20)…"
            sleep 15
          done

      - name: Configure the TWA for this release
        env:
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-dev.{0}', github.run_number) }}
        run: node scripts/configure-twa.mjs android/twa-manifest.json "$PWA_URL" "$VERSION_NAME"

      - name: Preconfigure Bubblewrap CLI paths
        run: |
          mkdir -p ~/.bubblewrap
          cat << BWC_EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${{ env.JAVA_HOME }}",
            "androidSdkPath": "${{ env.ANDROID_HOME }}"
          }
          BWC_EOF

      - name: Generate the Android project
        run: >-
          bubblewrap update
          --directory=android
          --manifest=android/twa-manifest.json
          --skipVersionUpgrade

      - name: Build the signed APK and App Bundle
        working-directory: android
        run: |
          KS_PASS="${BUBBLEWRAP_KEYSTORE_PASSWORD:-defaultPassword123}"
          K_PASS="${BUBBLEWRAP_KEY_PASSWORD:-defaultPassword123}"
          
          # Enviar ambas contraseñas por stdin para evitar bloqueo TTY
          printf "%s\n%s\n" "$KS_PASS" "$K_PASS" | bubblewrap build --skipPwaValidation
      - name: Create Digital Asset Links file
        env:
          ANDROID_SHA256_CERT_FINGERPRINT: ${{ vars.ANDROID_SHA256_CERT_FINGERPRINT }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'android' }}
        run: |
          fingerprint="$ANDROID_SHA256_CERT_FINGERPRINT"
          if [[ -z "$fingerprint" ]]; then
            fingerprint="$(keytool -list -v \
              -keystore android/android.keystore \
              -alias "$ANDROID_KEY_ALIAS" \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" |
              awk -F': ' '/SHA256:/{print $2; exit}')"
          fi
          if [[ -z "$fingerprint" ]]; then
            echo "::error::Could not determine the Android SHA-256 certificate fingerprint."
            exit 1
          fi
          mkdir -p assetlinks/.well-known
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.nexusengine.studio","sha256_cert_fingerprints":["%s"]}}]' "$fingerprint" > assetlinks/.well-known/assetlinks.json

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-engine-android-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
            assetlinks/.well-known/assetlinks.json

      - name: Publish the GitHub release for a tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            android/app-release-signed.apk#Nexus-Engine-${GITHUB_REF_NAME}-signed.apk \
            android/app-release-bundle.aab#Nexus-Engine-${GITHUB_REF_NAME}.aab \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes
