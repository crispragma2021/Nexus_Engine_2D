<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7046EC" />
    <title>Nexus Engine — Sin conexión</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #1d1d26;
        color: #fafafa;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        color: #c5c5c9;
        line-height: 1.5;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 6px;
        padding: 11px 16px;
        background: #7046ec;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/nexus-mark.svg" alt="Nexus Engine" />
      <h1>Estás sin conexión</h1>
      <p>Vuelve a conectarte para abrir Nexus Engine y seguir creando tu juego.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
